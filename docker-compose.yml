services:
  postgres:
    image: postgres:16
    container_name: llm_eval_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: eval
      POSTGRES_DB: llm_eval
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval -d llm_eval"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
